<!DOCTYPE html>
<html>
<head>
    <title>Edit Transaction</title>
</head>
<body>
    <h1>Edit Transaction</h1>

    {% if errors %}
    <ul style="color:red;">
        {% for e in errors %}
        <li>{{ e }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="POST">
        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" required><br><br>

        <label>Type:</label>
        <select name="type" required>
            <option value="income" {% if transaction.type == "income" %}selected{% endif %}>Income</option>
            <option value="expense" {% if transaction.type == "expense" %}selected{% endif %}>Expense</option>
        </select><br><br>

        <label>Category:</label>
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if c.id == transaction.category_id %}selected{% endif %}>{{ c.name }} ({{ c.type }})</option>
            {% endfor %}
        </select><br><br>

        <label>Date:</label>
        <input type="date" name="date" value="{{ transaction.date }}" required><br><br>

        <label>Note:</label>
        <input type="text" name="note" value="{{ transaction.note }}"><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
