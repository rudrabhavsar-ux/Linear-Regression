<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
</head>
<body>
    <h1>Categories</h1>
    <a href="{{ url_for('add_category') }}">Add Category</a>
    <table border="1" cellpadding="5">
        <tr><th>Name</th><th>Type</th><th>Actions</th></tr>
        {% for c in categories %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.type }}</td>
            <td>
                <a href="{{ url_for('edit_category', category_id=c.id) }}">Edit</a>
                <form action="{{ url_for('delete_category', category_id=c.id) }}" method="POST" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
