<!DOCTYPE html>
<html>
<head>
    <title>Budgets</title>
</head>
<body>
    <h1>Budgets</h1>
    <form method="POST">
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
        <input type="number" step="0.01" name="monthly_limit" placeholder="Monthly limit" required>
        <button type="submit">Set Budget</button>
    </form>

    <table border="1" cellpadding="5">
        <tr><th>Category</th><th>Monthly Limit</th></tr>
        {% for b in budgets %}
        <tr><td>{{ b.category_name }}</td><td>{{ b.monthly_limit }}</td></tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
