<!DOCTYPE html>
<html>
<head>
    <title>Personal Finance Tracker</title>
</head>
<body>
    <h1>Transactions</h1>

    <nav>
        <a href="{{ url_for('add') }}">Add Transaction</a> |
        <a href="{{ url_for('list_categories') }}">Categories</a> |
        <a href="{{ url_for('manage_budgets') }}">Budgets</a> |
        <a href="{{ url_for('manage_recurring') }}">Recurring</a> |
        <a href="{{ url_for('export_csv') }}">Export CSV</a> |
        <a href="{{ url_for('import_csv') }}">Import CSV</a>
    </nav>

    <table border="1" cellpadding="5">
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Note</th>
            <th>Actions</th>
        </tr>
        {% for t in transactions %}
        <tr>
            <td>{{ t.date }}</td>
            <td>{{ t.type }}</td>
            <td>{{ t.category_name }}</td>
            <td>{{ t.amount }}</td>
            <td>{{ t.note }}</td>
            <td>
                <a href="{{ url_for('edit', transaction_id=t.id) }}">Edit</a>
                <form action="{{ url_for('delete', transaction_id=t.id) }}" method="POST" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <h2>Charts</h2>
    <img src="{{ url_for('static', filename='charts/spend_by_category.png') }}" width="500"><br>
    <img src="{{ url_for('static', filename='charts/monthly_summary.png') }}" width="500"><br>
    <img src="{{ url_for('static', filename='charts/top_categories.png') }}" width="500"><br>
    <img src="{{ url_for('static', filename='charts/daily_trend.png') }}" width="500"><br>
</body>
</html>
