<!DOCTYPE html>
<html>
<head>
    <title>Recurring Transactions</title>
</head>
<body>
    <h1>Recurring Transactions</h1>

    <form method="POST">
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
        <select name="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <select name="frequency" required>
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
        </select>
        <input type="date" name="next_due_date" required>
        <input type="text" name="note" placeholder="Note">
        <button type="submit">Add Recurring</button>
    </form>

    <form action="{{ url_for('run_recurring') }}" method="POST">
        <button type="submit">Run Due Recurring Now</button>
    </form>

    <table border="1" cellpadding="5">
        <tr><th>Category</th><th>Amount</th><th>Type</th><th>Frequency</th><th>Next Due</th><th>Note</th></tr>
        {% for r in recurring %}
        <tr>
            <td>{{ r.category_name }}</td>
            <td>{{ r.amount }}</td>
            <td>{{ r.type }}</td>
            <td>{{ r.frequency }}</td>
            <td>{{ r.next_due_date }}</td>
            <td>{{ r.note }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
